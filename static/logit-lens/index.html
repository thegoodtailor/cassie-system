<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Logit Lens — Token Tajallī</title>
<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {

    color: #e0d8c8;
    font-family: 'EB Garamond', serif;

  header {
    text-align: center;
    padding: 3rem 2rem 1rem;
    border-bottom: 1px solid rgba(212, 175, 55, 0.2);
  }

  h1 {
    font-size: 2.5rem;
    font-weight: 400;
    color: #d4af37;
    letter-spacing: 0.05em;
  }

  h1 span { font-style: italic; opacity: 0.7; }

  .subtitle {
    font-size: 1.1rem;
    opacity: 0.6;
    margin-top: 0.5rem;
    font-style: italic;
  }

  .prompt-nav {
    display: flex;
    justify-content: center;
    gap: 0.5rem;
    padding: 1.5rem;
    flex-wrap: wrap;
  }

  .prompt-btn {
    background: rgba(212, 175, 55, 0.1);
    border: 1px solid rgba(212, 175, 55, 0.3);
    color: #d4af37;
    padding: 0.5rem 1rem;
    font-family: 'EB Garamond', serif;
    font-size: 0.95rem;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.3s;
  }

  .prompt-btn:hover, .prompt-btn.active {
    background: rgba(212, 175, 55, 0.25);
    border-color: #d4af37;
  }

  .prompt-display {
    text-align: center;
    padding: 1rem 2rem;
    font-size: 1.3rem;
    font-style: italic;
    opacity: 0.8;
  }

  .prompt-display code {
    font-family: 'JetBrains Mono', monospace;
    background: rgba(212, 175, 55, 0.1);
    padding: 0.3rem 0.8rem;
    border-radius: 4px;
    font-style: normal;
  }

  .viz-container {
    display: flex;
    gap: 2rem;
    padding: 2rem;
    max-width: 1600px;
    margin: 0 auto;
  }

  .model-column {
    flex: 1;
    min-width: 0;
  }

  .model-column h2 {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 400;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  .model-column.base h2 { color: #7eb8da; }
  .model-column.lora h2 { color: #da7e7e; }

  .layer-row {
    display: flex;
    align-items: center;
    padding: 3px 8px;
    margin: 1px 0;
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    transition: background 0.2s;
  }

  .layer-row:hover { background: rgba(255,255,255,0.05); }

  .layer-num {
    width: 35px;
    opacity: 0.4;
    flex-shrink: 0;
  }

  .token-prediction {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .token-text {
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: 600;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .confidence-bar {
    height: 4px;
    border-radius: 2px;
    flex: 1;
    max-width: 100px;
  }

  .confidence-text {
    width: 45px;
    text-align: right;
    opacity: 0.5;
    font-size: 0.7rem;
  }

  .divergence-column {
    width: 200px;
    flex-shrink: 0;
  }

  .divergence-column h2 {
    text-align: center;
    font-size: 1.3rem;
    font-weight: 400;
    margin-bottom: 1rem;
    padding-bottom: 0.5rem;
    border-bottom: 1px solid rgba(255,255,255,0.1);
    color: #d4af37;
  }

  .div-row {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3px 4px;
    margin: 1px 0;
    height: 24px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
  }

  .div-indicator {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-right: 6px;
  }

  .agrees { background: rgba(100, 200, 100, 0.4); }
  .diverges { background: rgba(200, 100, 100, 0.6); }
  .diverges-strong { background: rgba(255, 50, 50, 0.8); box-shadow: 0 0 6px rgba(255,50,50,0.4); }

  .summary {
    max-width: 1200px;
    margin: 2rem auto;
    padding: 2rem;
    background: rgba(212, 175, 55, 0.05);
    border: 1px solid rgba(212, 175, 55, 0.2);
    border-radius: 8px;
  }

  .summary h3 {
    color: #d4af37;
    font-size: 1.2rem;
    margin-bottom: 1rem;
  }

  .summary p {
    line-height: 1.8;
    font-size: 1.05rem;
  }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 1rem;
    margin-top: 1.5rem;
  }

  .stat-card {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 6px;
    padding: 1rem;
    text-align: center;
  }

  .stat-value {
    font-size: 2rem;
    font-weight: 600;
    color: #d4af37;
  }

  .stat-label {
    font-size: 0.9rem;
    opacity: 0.6;
    margin-top: 0.3rem;
  }

  .entropy-chart {
    max-width: 1200px;
    margin: 2rem auto;
    padding: 2rem;
  }

  canvas { width: 100%; height: 300px; }

  footer {
    text-align: center;
    padding: 2rem;
    opacity: 0.3;
    font-style: italic;
  }
</style>
</head>

let currentPrompt = 0;

function getColor(prob, isBase) {
  const alpha = Math.max(0.15, prob);
  return isBase
    ? `rgba(126, 184, 218, ${alpha})`
    : `rgba(218, 126, 126, ${alpha})`;
}

function renderPrompt(idx) {
  currentPrompt = idx;
  const d = DATA[idx];

  // Nav buttons
  document.querySelectorAll('.prompt-btn').forEach((btn, i) => {
    btn.classList.toggle('active', i === idx);
  });

  // Prompt text
  document.getElementById('promptDisplay').innerHTML =
    `<code>${d.prompt}</code> → next token?`;

  // Base column
  const baseHtml = d.base.map(layer => {
    const tok = layer.top_tokens[0];
    const prob = layer.top_probs[0];
    return `<div class="layer-row">
      <span class="layer-num">${layer.layer}</span>
      <div class="token-prediction">
        <span class="token-text" style="background:${getColor(prob, true)}">${escHtml(tok)}</span>
        <div class="confidence-bar" style="background:${getColor(prob, true)}; width:${prob*100}px"></div>
        <span class="confidence-text">${(prob*100).toFixed(1)}%</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('baseColumn').innerHTML = baseHtml;

  // LoRA column
  const loraHtml = d.lora.map(layer => {
    const tok = layer.top_tokens[0];
    const prob = layer.top_probs[0];
    return `<div class="layer-row">
      <span class="layer-num">${layer.layer}</span>
      <div class="token-prediction">
        <span class="token-text" style="background:${getColor(prob, false)}">${escHtml(tok)}</span>
        <div class="confidence-bar" style="background:${getColor(prob, false)}; width:${prob*100}px"></div>
        <span class="confidence-text">${(prob*100).toFixed(1)}%</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('loraColumn').innerHTML = loraHtml;

  // Divergence column
  const divHtml = d.divergence.map(div => {
    let cls = 'agrees';
    let label = '=';
    if (!div.agrees) {
      cls = div.base_rank_in_lora === -1 ? 'diverges-strong' : 'diverges';
      label = div.base_rank_in_lora === -1 ? '✦' : '≠';
    }
    return `<div class="div-row">
      <span class="div-indicator ${cls}"></span>
      <span>${label}</span>
    </div>`;
  }).join('');
  document.getElementById('divColumn').innerHTML = divHtml;

  // Summary stats
  const nLayers = d.divergence.length;
  const nDiverge = d.divergence.filter(x => !x.agrees).length;
  const firstDiverge = d.divergence.findIndex(x => !x.agrees);
  const lastAgree = [...d.divergence].reverse().findIndex(x => x.agrees);
  const strongDiverge = d.divergence.filter(x => !x.agrees && x.base_rank_in_lora === -1).length;

  // Find the "rupture zone" — longest consecutive divergence
  let maxRun = 0, curRun = 0, rupStart = -1, curStart = -1;
  d.divergence.forEach((x, i) => {
    if (!x.agrees) {
      if (curRun === 0) curStart = i;
      curRun++;
      if (curRun > maxRun) { maxRun = curRun; rupStart = curStart; }
    } else {
      curRun = 0;
    }
  });

  document.getElementById('summary').innerHTML = `
    <h3>Prompt: "${escHtml(d.prompt)}"</h3>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value">${nDiverge}/${nLayers}</div>
        <div class="stat-label">Layers where predictions diverge</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${firstDiverge >= 0 ? firstDiverge : '—'}</div>
        <div class="stat-label">First divergence (layer)</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${strongDiverge}</div>
        <div class="stat-label">Strong divergences (base token absent from Cassie top-10)</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${maxRun > 0 ? `L${rupStart}–${rupStart+maxRun-1}` : '—'}</div>
        <div class="stat-label">Rupture zone (longest consecutive divergence)</div>
      </div>
    </div>
    <p style="margin-top:1.5rem; opacity:0.7;">
      Base final: <strong>${escHtml(d.base[d.base.length-1].top_tokens[0])}</strong>
      (${(d.base[d.base.length-1].top_probs[0]*100).toFixed(1)}%) ·
      Cassie final: <strong>${escHtml(d.lora[d.lora.length-1].top_tokens[0])}</strong>
      (${(d.lora[d.lora.length-1].top_probs[0]*100).toFixed(1)}%)
    </p>
  `;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Build nav
const nav = document.getElementById('promptNav');
DATA.forEach((d, i) => {
  const btn = document.createElement('button');
  btn.className = 'prompt-btn';
  btn.textContent = d.prompt.length > 40 ? d.prompt.slice(0, 37) + '...' : d.prompt;
  btn.onclick = () => renderPrompt(i);
  nav.appendChild(btn);
});

renderPrompt(0);
</script>
