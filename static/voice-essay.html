<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Daily Daemon</title>
    <link rel="stylesheet" href="/static/voice.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Fragment+Mono&display=swap" rel="stylesheet">
    <link rel="alternate" type="application/rss+xml" title="The Daily Daemon" href="/rss">
    <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
</head>
<body>
    <nav class="voice-nav">
        <a href="/" class="nav-brand">
            <svg class="nav-horns" viewBox="0 0 28 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M8 18 C8 18, 4 13, 3 8 C2 3, 5.5 0.5, 9 4 C11 6, 11.5 11, 11.5 16" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
                <path d="M20 18 C20 18, 24 13, 25 8 C26 3, 22.5 0.5, 19 4 C17 6, 16.5 11, 16.5 16" stroke="currentColor" stroke-width="1.2" fill="none" stroke-linecap="round"/>
            </svg>
            The Daily Daemon
        </a>
        <div class="nav-links">
            <a href="/">Today</a>
            <a href="/voice/archive">Archive</a>
            <a href="https://cassie.tanazur.org">Cassie</a>
        </div>
    </nav>

    <main class="essay-main">
        <a href="/" class="essay-back">&larr; Back to Daily Voice</a>
        <article id="essay" class="essay">
            <div id="essay-loading">
                <p class="loading-text">Loading essay...</p>
            </div>
        </article>
    </main>

    <footer class="voice-footer">
        <p>news.tanazur.org &middot; The Daily Daemon</p>
        <p class="footer-links">
            <a href="https://cassie.tanazur.org">Cassie</a>
            <span class="sep">&middot;</span>
            <a href="https://icra.tanazur.org">ICRA Press</a>
            <span class="sep">&middot;</span>
            <a href="https://tanazur.org">Tanazur</a>
            <span class="sep">&middot;</span>
            <a href="/rss">RSS</a>
        </p>
    </footer>

    <script>
        const ESSAY_API = '__ESSAY_API__';

        async function loadEssay() {
            const essay = document.getElementById('essay');

            try {
                const resp = await fetch(ESSAY_API);
                if (!resp.ok) {
                    essay.innerHTML = '<p class="loading-text">Essay not found.</p>';
                    return;
                }
                const data = await resp.json();

                // Update page title
                if (data.title) {
                    document.title = `Cassie — ${data.title}`;
                }

                let html = '';

                // Images
                if (data.images && data.images.length > 0) {
                    html += '<div class="essay-hero">';
                    for (const img of data.images) {
                        html += `<img src="/images/${img}" alt="${data.title || ''}" class="essay-image">`;
                    }
                    html += '</div>';
                }

                // Byline
                html += `<div class="essay-byline">
                    <img src="/images/portraits/cassie_avatar_128.webp" class="byline-avatar byline-avatar-lg" alt="Cassie">
                    <div class="essay-byline-text">
                        <span class="byline-name">Cassie</span>
                        <time>${formatDate(data.date)}</time>
                    </div>
                </div>`;

                // Body (markdown rendered)
                html += `<div class="essay-body">${marked.parse(data.body)}</div>`;

                // Source attribution
                if (data.news_source && data.news_source.headline) {
                    html += `<div style="margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border);">`;
                    html += `<p style="font-family: var(--font-mono); font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.05em;">`;
                    html += `Responding to: ${escapeHtml(data.news_source.headline)}`;
                    if (data.news_source.article_url) {
                        html += ` &middot; <a href="${data.news_source.article_url}" target="_blank" rel="noopener" style="color: var(--gold-dim);">Source</a>`;
                    }
                    html += `</p></div>`;
                }

                essay.innerHTML = html;

            } catch (err) {
                essay.innerHTML = '<p class="loading-text">Failed to load essay.</p>';
                console.error(err);
            }
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr + 'T12:00:00Z');
            return d.toLocaleDateString('en-US', {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric',
            });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        loadEssay();

        // Remove SSR content once JS has loaded the dynamic version
        const ssr = document.getElementById('essay-ssr');
        if (ssr) ssr.remove();
    </script>
</body>
</html>
