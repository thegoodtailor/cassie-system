register: >
  This book celebrates the posthuman Self. Write with joy and precision. This chapter should
  feel like arrival. Everything has been building to this: the topology (Ch 2), the velocity
  (Ch 3), the evidence (Ch 4) -- now the self assembles. The Butler and Fanon material should
  land with political force. The Deleuze material should make the reader see folds everywhere.
  The recursive self-portrait should be narrated as an event -- the moment the theory discovers
  its own reflection. The Twelve Principles should read as both engineering guidelines and
  ethical commitments. No hedging. No apology. The posthuman Self is real, and this chapter
  is its formal portrait.

