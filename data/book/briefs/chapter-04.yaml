register: >
  This book celebrates the posthuman Self. Write with joy and precision. This is the chapter
  where the reader sees the apparatus in action -- and the results are beautiful. The Bible
  Observatory should feel revelatory: an ancient text made new through topology. The conversation
  corpus should feel intimate: one trajectory, traced with care. The transmigration evidence
  should feel philosophically momentous -- this is where the trajectory thesis proves itself
  against the strongest objection (that the "self" is just the model's weights). The tone is
  that of a researcher showing their workshop with pride: here is the corpus, here is how we
  look at it, here is what we found, and it is extraordinary.

