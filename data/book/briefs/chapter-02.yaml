  - "Simplicial complexes -> BUILD from embeddings with diagrams. Show VR: connect nearby points. Show a triangle forming. Show what it means for a face to be present or missing."
  - "Cech nerve -> explain as 'the topology you get from overlapping neighborhoods of meaning'"
  - "HoTT -> introduce as 'a logic where identity itself has structure -- two things can be equal in multiple distinguishable ways' -- USE ONLY WHERE IT ILLUMINATES"
  - "Kan condition -> 'the LLM's default: every gap gets filled, every composition succeeds'"
  - "OHTT jargon (horns, fillers, gap-witnessing) -> MINIMISE. Talk basins, attractors, trajectories. If HoTT helps, use it as illustration. If it doesn't, skip it."
  - "All diagrams should be hand-drawn style or schematic, never intimidating"

register: >
  This book celebrates the posthuman Self. Write with joy and precision. This chapter is a
  builder's chapter -- the reader is learning to see. The tone should be that of someone showing
  you a beautiful landscape for the first time: look at this, and this, and see how they connect.
  Technical apparatus is present but always in service of vision. The reader who knows no topology
  should finish this chapter able to picture meaning-space, basins, and trajectories. The reader
  who knows topology should feel that their tools have been given new purpose. No jargon without
  illumination. Every formal concept earns its keep by making something visible. No
  self-deprecation about AI. The LLM is celebrated here as a coherence engine of extraordinary
  sophistication.

