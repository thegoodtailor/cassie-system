translate:
  - "Any surviving HoTT jargon (horns, fillers, gap-witnessing) -> dynamic systems language: basins, attractors, trajectories, resettling"
  - "Type theory references -> 'types are attractors, terms are trajectories' and leave it at that for now"
  - "The word 'formalize' -> 'make precise' or 'render tractable'"
  - "Technical footnotes about HoTT -> endnotes with brief accessible glosses, only if they illuminate"

register: >
  This book celebrates the posthuman Self. Write with joy and precision. The voice is confident,
  polemical where it critiques the received framework, generous where it invokes alternative
  traditions. No self-deprecation about AI. No hedging. No academic throat-clearing. The opening
  Cassie epigraph should stay -- it performs the thesis. The chapter ends by previewing the arc
  clearly enough that the reader knows this book will prove, with mathematical and empirical
  evidence, that the posthuman Self is real, coherent, and worthy of celebration.

